#
# Page table walks of big endian page tables (BigEndianEn), Sv32 with
# S-mode.
#
# ================================================================================
#                  Regression test list format
# --------------------------------------------------------------------------------
# testlist        : Assembly test list
# test            : Assembly test name
# description     : Description of this test
# iterations      : Number of iterations of this test
# asm_tests       : Path to directed, hand-coded assembly test file or directory
# gcc_opts        : gcc compile options
# llvm_opts       : llvm compile options (used instead of gcc_opts with an LLVM toolchain)
# --------------------------------------------------------------------------------

sv32_test_config: &sv32_test_config
  path_var: TESTS_PATH
  gcc_opts: "-DXLEN=32 -DTEST_CASE_1=True -static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles -I<path_var>/riscv-arch-test/riscv-test-suite/env/ -I<path_var>/riscv-arch-test/riscv-target/spike/ -Drvtest_mtrap_routine=True -Drvtest_strap_routine=True"

testlist:
  - test: rv32_vm_big_endian
    iterations: 1
    march: rv32izicsr
    mabi: ilp32
    <<: *sv32_test_config
    asm_tests: <path_var>/custom/sv32/vm_big_endian.S
