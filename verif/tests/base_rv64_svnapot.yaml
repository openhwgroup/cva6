#   base_rv64_svnapot.yaml
#
#   Svnapot tests, for the cv64 targets with SvnapotEn set.
# ------------------------------------------------------------------------------

sv39_test_config: &sv39_test_config
  path_var: TESTS_PATH
  gcc_opts: "-static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles -I<path_var>/custom/env"

testlist:
  - test: vm_svnapot_64k
    iterations: 1
    <<: *sv39_test_config
    asm_tests: <path_var>/custom/sv39/vm_svnapot_64k.S
