#   testlist_sdtrig_h.yaml
#
#   Sdtrig with the hypervisor extension, on RV64: the vs and vu mode bits of
#   the triggers.
# ------------------------------------------------------------------------------

p_test_config: &p_test_config
  path_var: TESTS_PATH
  gcc_opts: "-static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles -I<path_var>/riscv-tests/isa/macros/scalar/ -I<path_var>/riscv-tests/env/p/ -I<path_var>/riscv-tests/riscv-target/spike/"

testlist:
  - test: sdtrig_virt_modes
    iterations: 1
    <<: *p_test_config
    asm_tests: <path_var>/custom/sdtrig/sdtrig_virt_modes.S
