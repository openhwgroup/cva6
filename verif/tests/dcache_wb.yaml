#   dcache_wb.yaml
#
#   Write policy of a write-back data cache (CacheWritePolicy = CACHE_WB,
#   RVZiCbom): stores stay in the cache.
# ------------------------------------------------------------------------------

custom_test_config: &custom_test_config
  path_var: TESTS_PATH
  gcc_opts: "-DWB_WORD_WRITES_BACK=1 -DWT_WORD_WRITES_BACK=1 -Wl,-T,<path_var>/custom/cache/write_policy.ld -static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles <path_var>/custom/common/syscalls.c <path_var>/custom/common/crt.S -I<path_var>/custom/env -I<path_var>/custom/common -lgcc"
  llvm_opts: "-DWB_WORD_WRITES_BACK=1 -DWT_WORD_WRITES_BACK=1 -Wl,-T,<path_var>/custom/cache/write_policy.ld -static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles <path_var>/custom/common/syscalls.c <path_var>/custom/common/crt.S -I<path_var>/custom/env -I<path_var>/custom/common"

testlist:
  - test: write_policy
    iterations: 1
    <<: *custom_test_config
    asm_tests: <path_var>/custom/cache/write_policy.S
