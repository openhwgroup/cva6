#
# Big endian data accesses (BigEndianEn): load and store byte swapping, on
# RV32 and RV64. The page table walks of big endian page tables are in
# base_rv32_be_mmu (Sv32) and base_rv64_be_mmu (Sv39).
#
# ================================================================================
#                  Regression test list format
# --------------------------------------------------------------------------------
# testlist        : Assembly test list
# test            : Assembly test name
# description     : Description of this test
# iterations      : Number of iterations of this test
# asm_tests       : Path to directed, hand-coded assembly test file or directory
# gcc_opts        : gcc compile options
# llvm_opts       : llvm compile options (used instead of gcc_opts with an LLVM toolchain)
# --------------------------------------------------------------------------------

custom_test_config: &custom_test_config
  path_var: TESTS_PATH
  gcc_opts: "-static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles <path_var>/custom/common/syscalls.c <path_var>/custom/common/crt.S -I<path_var>/custom/env -I<path_var>/custom/common -lgcc"
  llvm_opts: "-static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles <path_var>/custom/common/syscalls.c <path_var>/custom/common/crt.S -I<path_var>/custom/env -I<path_var>/custom/common"

testlist:
  - test: be_swap_test
    iterations: 1
    <<: *custom_test_config
    asm_tests: <path_var>/custom/be/be_swap_test.S
