# ================================================================================
#                  Regression test list format
# --------------------------------------------------------------------------------
# testlist        : Assembly test list
# test            : Assembly test name
# description     : Description of this test
# gen_opts        : Instruction generator options
# iterations      : Number of iterations of this test
# no_iss          : Enable/disable ISS simulator (Optional)
# gen_test        : Test name used by the instruction generator
# asm_tests       : Path to directed, hand-coded assembly test file or directory
# rtl_test        : RTL simulation test name
# cmp_opts        : Compile options passed to the instruction generator
# sim_opts        : Simulation options passed to the instruction generator
# no_post_compare : Enable/disable comparison of trace log and ISS log (Optional)
# compare_opts    : Options for the RTL & ISS trace comparison
# gcc_opts        : gcc compile options
# --------------------------------------------------------------------------------
#
# sv39 privilege/MMU tests for cv64a6_imafdc_sv39 targets without PMP.
# Test files are from riscv-arch-test upstream v4.0 (origin/main tests/priv/Sv/).
# They use the v4.0 riscv_arch_test.h framework, with CVA6-specific target config.
# For targets without PMP: cv64a6_imafdc_sv39_hpdcache_nopmp_*.
# --------------------------------------------------------------------------------

# v4.0 framework include paths (mirrors upstream dut_include_dir + tests/env layout):
#   priv/config/nopmp/ - rvtest_config.h (RVMODEL_NUM_PMPS 0, CONFORMING_SM_SUPPORTED, SV39_SUPPORTED, ...)
#   priv/config/       - rvmodel_macros.h, link.ld
#   env/               - riscv_arch_test.h and all framework headers
sv39_test_config: &sv39_test_config
  path_var: TESTS_PATH
  gcc_opts: "-DXLEN=64 -DTEST_FLEN=64 -static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles -I<path_var>/custom/privtests/priv/config/nopmp/ -I<path_var>/custom/privtests/priv/config/ -I<path_var>/custom/privtests/env/"

testlist:
  ##sv39 Supervisor-mode tests
  - test: sv39_canonical_Smode
    iterations: 1
    <<: *sv39_test_config
    asm_tests: <path_var>/custom/privtests/priv/Sv/sv39_canonical_Smode.S

  - test: sv39_canonical_Umode
    iterations: 1
    <<: *sv39_test_config
    asm_tests: <path_var>/custom/privtests/priv/Sv/sv39_canonical_Umode.S

