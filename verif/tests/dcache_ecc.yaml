# ================================================================================
# Dcache ECC and scrubber
# --------------------------------------------------------------------------------
# Only meaningful on a target that sets DcacheEccEnable and
# DcacheEccScrubberEnable: the test reads the presence bits of the dcache CSR
# and fails if they are clear.
# ================================================================================

# Directed tests of verif/tests/custom need the local runtime instead of the
# riscv-tests environment: crt.S for the reset vector and tohost, and syscalls.c
# for the exit path.
custom_test_config: &custom_test_config
  path_var: TESTS_PATH
  gcc_opts: "-static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles <path_var>/custom/common/syscalls.c <path_var>/custom/common/crt.S -I<path_var>/custom/env -I<path_var>/custom/common -lgcc"
  llvm_opts: "-static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles <path_var>/custom/common/syscalls.c <path_var>/custom/common/crt.S -I<path_var>/custom/env -I<path_var>/custom/common"

testlist:
  - test: dcache_csr_test
    iterations: 1
    <<: *custom_test_config
    asm_tests: <path_var>/custom/dcache_csr_test/dcache_csr_test.c
