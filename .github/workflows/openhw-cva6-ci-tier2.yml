# ================================================================================
# OpenHW CVA6 CI - Tier 2: master_candidate cook.py regression
# ================================================================================
#
# Broader public regression for the initial master_candidate AXI targets. Tier 2
# expands the Tier 1 base tests with the supported Zcmt and PMP testlists while
# preserving truthful job failures and downloadable evidence.
# ================================================================================

name: openhw-cva6-ci-tier2

on:
  push:
    branches:
      - master_candidate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openhw-cva6-ci-tier2-${{ github.ref }}
  cancel-in-progress: true

env:
  SPIKE_TANDEM: 1
  NUM_JOBS: 8
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  setup-tools:
    name: Setup Tools
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup CVA6 Environment
        uses: ./.github/actions/setup-cva6-env
        with:
          install-tools: "true"
          install-cook-dependencies: "true"

      - name: Validate master_candidate Tier CI adapter
        run: python3 .github/tests/test_master_candidate_cook_tier.py -v

  execute-rv32-tier2:
    name: RV32 Tier2 ${{ matrix.config }} / ${{ matrix.testcase }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: setup-tools
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: cv32a60x_axi
            testcase: base-rv32-p
            mode: cook-testlist
            simulator: veri-testharness,spike
            install_script: install-riscv-tests
            testlist: verif/tests/base_rv32_p.yaml
            toolchain: github_actions_gcc
            compiler_march: rv32imc_zicsr_zba_zbb_zbs_zbc
            compiler_march_reason: public-gcc-13.2-does-not-accept-zcmt
            expected_enabled_tests: 5
            install_llvm18: false

          - config: cv32a60x_axi
            testcase: base-zcmt
            mode: cook-testlist
            simulator: veri-testharness,spike
            install_script: ""
            testlist: verif/tests/base_zcmt.yaml
            toolchain: github_actions_llvm18
            compiler_march: rv32imc_zicsr_zba_zbb_zbs_zbc_zcmt
            compiler_march_reason: llvm-18-provides-zcmt-assembly-support
            expected_enabled_tests: 4
            install_llvm18: true

          - config: cv32a65x_axi
            testcase: base-rv32-p
            mode: cook-testlist
            simulator: veri-testharness,spike
            install_script: install-riscv-tests
            testlist: verif/tests/base_rv32_p.yaml
            toolchain: github_actions_gcc
            compiler_march: rv32imc_zicsr_zba_zbb_zbs_zbc_zifencei
            compiler_march_reason: public-gcc-13.2-does-not-accept-zcmt
            expected_enabled_tests: 5
            install_llvm18: false

          - config: cv32a65x_axi
            testcase: base-zcmt
            mode: cook-testlist
            simulator: veri-testharness,spike
            install_script: ""
            testlist: verif/tests/base_zcmt.yaml
            toolchain: github_actions_llvm18
            compiler_march: rv32imc_zicsr_zba_zbb_zbs_zbc_zcmt_zifencei
            compiler_march_reason: llvm-18-provides-zcmt-assembly-support
            expected_enabled_tests: 4
            install_llvm18: true

          - config: cv32a65x_axi
            testcase: base-pmp
            mode: cook-testlist
            simulator: veri-testharness,spike
            install_script: ""
            testlist: verif/tests/base_pmp.yaml
            toolchain: github_actions_gcc
            compiler_march: rv32imc_zicsr_zba_zbb_zbs_zbc_zifencei
            compiler_march_reason: public-gcc-13.2-does-not-accept-zcmt
            expected_enabled_tests: 5
            install_llvm18: false

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup CVA6 Environment
        uses: ./.github/actions/setup-cva6-env
        with:
          install-cook-dependencies: "true"
          install-llvm18: ${{ matrix.install_llvm18 }}

      - name: Install simulation prerequisites
        run: source ci/install-prereq.sh

      - name: Run Tier 2 for ${{ matrix.config }} / ${{ matrix.testcase }}
        env:
          TIER_NAME: Tier 2
          TIER_MODE: ${{ matrix.mode }}
          TIER_CONFIG: ${{ matrix.config }}
          TIER_TESTCASE: ${{ matrix.testcase }}
          TIER_SIMULATOR: ${{ matrix.simulator }}
          TIER_INSTALL_SCRIPT: ${{ matrix.install_script }}
          TIER_TESTLIST: ${{ matrix.testlist }}
          TIER_TOOLCHAIN: ${{ matrix.toolchain }}
          TIER_COMPILER_MARCH: ${{ matrix.compiler_march }}
          TIER_COMPILER_MARCH_REASON: ${{ matrix.compiler_march_reason }}
          TIER_EXPECTED_ENABLED_TESTS: ${{ matrix.expected_enabled_tests }}
          TIER_EVENT_HEAD_SHA: ${{ github.sha }}
          TIER_EVENT_BASE_SHA: ${{ github.event.before || '' }}
        run: bash .github/scripts/run-tier-regression.sh

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier2-rv32-${{ matrix.config }}-${{ matrix.testcase }}
          path: |
            ci-results/
            artifacts/reports/
            build/${{ matrix.config }}/compile/
            build/${{ matrix.config }}/simulation/sim_verilator_testharness/
            build/${{ matrix.config }}/config/
          if-no-files-found: error
          retention-days: 14
